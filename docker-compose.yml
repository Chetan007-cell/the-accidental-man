services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tam
      POSTGRES_PASSWORD: tam
      POSTGRES_DB: tam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tam -d tam"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
